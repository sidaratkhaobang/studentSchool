name: Deploy project documentation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - laravel/docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - tests/docs/**
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - laravel/docs/**
      - mkdocs.yml
      - requirements-docs.txt
      - tests/docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Test generated pages, links, diagrams and artifact safety
        run: python -m unittest discover -s tests/docs -v
      - name: Build HTML documentation
        run: python -m mkdocs build --strict
      - name: Upload only the documentation site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy HTML documentation
        id: deployment
        uses: actions/deploy-pages@v4
